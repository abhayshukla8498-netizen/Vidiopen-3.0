name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip and Setup Project Structure
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d extracted_project
            cp -rf extracted_project/* .
          fi

          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            TARGET_DIR=$(dirname "$SETTINGS_FILE")
            if [ "$TARGET_DIR" != "." ]; then
              echo "Moving files from $TARGET_DIR to root..."
              cp -rf "$TARGET_DIR"/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Files and Keystore
        run: |
          mkdir -p app
          # .env aur .env.example dono ensure karein (Secrets Gradle plugin ke liye)
          test -f .env || echo "GEMINI_API_KEY=dummy_key" > .env
          test -f .env.example || echo "GEMINI_API_KEY=dummy_key" > .env.example
          test -f app/google-services.json || echo '{"project_info":{"project_number":"123","project_id":"vidiopen","storage_bucket":"vidiopen.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.vidiopen.videoplayer"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
          
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Abhay,OU=Dev,O=Vidiopen,L=City,S=State,C=IN"
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: ./gradlew assembleRelease -x test -x lint -x check --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          

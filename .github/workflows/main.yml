 name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Folder structure auto-fix: agar files kisi subfolder ke andar hain toh unhe root par layega
      - name: Auto Fix Directory Structure
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \;)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moving files from $SUBDIR to root..."
              shopt -s dotglob
              mv $SUBDIR/* .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Cache ko remove kiya taaki missing path error na aaye

      - name: Setup Dummy Files & Keystore
        run: |
          # 1. Dummy .env create
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=dummy_key_for_build" > .env
          fi

          # 2. Dummy google-services.json
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"123456789","project_id":"vidiopen","storage_bucket":"vidiopen.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.vidiopen.videoplayer"}},"api_key":[{"current_key":"dummy_key"}]}]}' > app/google-services.json
          fi

          # 3. Release Keystore generate
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "android123" \
            -keypass "android123" \
            -dname "CN=Abhay, OU=Dev, O=Vidiopen, L=City, S=State, C=IN"

      # Agar repo me gradlew missing ho toh auto-setup karega
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: "android123"
          KEY_PASSWORD: "android123"
        run: |
          ./gradlew assembleRelease -x test -x lint -x check --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidiopen-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          
